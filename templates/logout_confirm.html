<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm sign out | Appora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-card text-center">
            <span class="auth-icon"><i class="bi bi-box-arrow-right"></i></span>
            <h1>Sign out of Appora?</h1>
            <p>You will need to enter your credentials again to access this account.</p>
            <div class="d-flex gap-2 justify-content-center flex-wrap mt-4">
                <a class="btn btn-outline-dark rounded-pill px-4" href="{{ cancel_url }}">Stay signed in</a>
                <form method="post" action="{{ url_for('main.logout') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <input type="hidden" name="confirm" value="yes">
                    <button class="btn btn-danger rounded-pill px-4" type="submit">Yes, sign out</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
