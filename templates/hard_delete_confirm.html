<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm permanent deletion | Appora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="recovery-page">
    <main class="recovery-card permanent-delete-card">
        <a class="navbar-brand" href="{{ url_for('main.admin_dashboard') }}"><span class="brand-mark"><i class="bi bi-boxes"></i></span>Appora</a>
        <span class="recovery-icon error"><i class="bi bi-exclamation-triangle"></i></span>
        <span class="eyebrow">Irreversible action</span>
        <h1>Permanently delete this {{ target_type }}?</h1>
        <p>This will erase <strong>{{ target_label }}</strong> and its associated stored data. It cannot be restored afterward.</p>
        {% if error %}<div class="dashboard-alert error"><i class="bi bi-shield-x"></i>{{ error }}</div>{% endif %}
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="permanent_confirm" value="yes">
            <label>Type <strong>{{ target_label }}</strong> to confirm</label>
            <input name="confirm_label" required autocomplete="off" spellcheck="false">
            <label>Your administrator password</label>
            <input type="password" name="admin_password" required autocomplete="current-password">
            <button class="btn btn-danger rounded-pill w-100" type="submit"><i class="bi bi-trash3 me-2"></i>Delete permanently</button>
        </form>
        <a class="recovery-back" href="{{ cancel_url }}">Cancel and return to Trash</a>
    </main>
</body>
</html>
