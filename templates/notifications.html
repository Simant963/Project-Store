<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | Appora</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='interior-3d.css') }}"><script nonce="{{ csp_nonce }}" defer src="{{ url_for('static', filename='interior-3d.js') }}"></script></head><body class="member-dashboard"><nav class="member-nav"><div class="container d-flex justify-content-between"><a class="navbar-brand" href="{{ url_for('main.home') }}"><span class="brand-mark"><i class="bi bi-boxes"></i></span>Appora</a><a class="btn btn-outline-dark rounded-pill" href="{{ url_for('main.developer_dashboard' if user.role.value=='developer' else 'main.user_dashboard') }}">Dashboard</a></div></nav><main class="container notification-main"><div class="notification-heading"><div><span class="section-label">Updates</span><h1>Notifications</h1><p>Account decisions and approved app releases stay here.</p></div>{% if notifications %}<form method="post" action="{{ url_for('main.read_all_notifications') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-outline-dark rounded-pill">Mark all as read</button></form>{% endif %}</div><section class="notification-list">{% for item in notifications %}<form method="post" action="{{ url_for('main.open_notification',notification_id=item.id) }}" class="{{ '' if item.is_read else 'unread' }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit"><span class="notification-icon {{ item.type.value }}"><i class="bi {{ 'bi-person-check' if item.type.value=='account' else ('bi-box-seam' if item.type.value=='app' else 'bi-arrow-up-circle') }}"></i></span><span><strong>{{ item.title }}</strong><small>{{ item.message }}</small><time>{{ item.created_at.strftime('%d %b %Y, %H:%M') }} UTC</time></span>{% if not item.is_read %}<i class="unread-dot"></i>{% endif %}</button></form>{% else %}<div class="library-empty">You have no notifications yet.</div>{% endfor %}</section></main></body></html>
