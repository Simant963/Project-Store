services:
  clamav-updater:
    build: .
    restart: unless-stopped
    user: root
    command: ["freshclam", "--daemon", "--foreground=true"]
    volumes:
      - clamav_data:/var/lib/clamav

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  init-storage:
    build: .
    user: root
    command: ["sh", "-c", "mkdir -p /data/appora/uploads && chown -R 10001:10001 /data/appora/uploads"]
    volumes:
      - private_uploads:/data/appora/uploads
    restart: "no"

  migrate:
    build: .
    env_file: .env.production
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ["flask", "--app", "app", "db", "upgrade"]
    depends_on:
      init-storage:
        condition: service_completed_successfully
    volumes:
      - private_uploads:/data/appora/uploads
      - clamav_data:/var/lib/clamav:ro
    restart: "no"

  web:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - private_uploads:/data/appora/uploads
      - clamav_data:/var/lib/clamav:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/certs:/etc/nginx/certs:ro

volumes:
  private_uploads:
  clamav_data:
  redis_data:
