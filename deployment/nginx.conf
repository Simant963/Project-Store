limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
server_tokens off;

upstream appora_web {
    server web:8000;
    keepalive 32;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

server {
    listen 80;
    server_name _;
    location /health { proxy_pass http://web:8000/health; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 220m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 240s;

    location ~ (^|/)\.(?!well-known/) { return 404; }

    location /static/ {
        proxy_pass http://appora_web;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location /events/ {
        proxy_pass http://appora_web;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }

    location ~ ^/(admin/login|admin/password-resets|login/|forgot-password|manual-password-reset|reset-password) {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://appora_web;
    }
    location / { proxy_pass http://appora_web; }
}
